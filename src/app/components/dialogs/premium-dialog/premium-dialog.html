<h2 mat-dialog-title>Contenuto Premium</h2>
    <mat-dialog-content>
      <p>Questa sezione è riservata agli utenti <strong>Premium</strong>.</p>
      <p>Passa a Premium per accedere al Personal Trainer, workout esclusivi e piani alimentari personalizzati.</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-stroked-button mat-dialog-close>Annulla</button>
      <button mat-raised-button color="primary" (click)="pay()">
        Passa a Premium
      </button>
    </mat-dialog-actions>
