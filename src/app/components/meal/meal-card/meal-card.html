<div class="meal-container">

  <mat-card class="meal-card">

    <mat-card-header>
      <mat-card-title>
        <strong>{{ meal.name | capitalize }}</strong>
      </mat-card-title>
    </mat-card-header> 

    <hr>

    <mat-card-content>
      <div class="meal-info">
        <div class="info-row">
          <strong>Calorie totali:</strong>
          <span>{{ meal.totalCalories | calories }}</span>
        </div>

        <div class="info-row">
          <strong>Numero ingredienti:</strong>
          <span>{{ meal.ingredients.length }}</span>
        </div>

        <div class="info-row">
          <strong>Creato il:</strong>
          <span>{{ meal.createdAt | createdAtFormat }}</span>
        </div>
      </div>
    </mat-card-content>
 
    <mat-card-actions>

      <button mat-button color="primary" (click)="onDetail()">
        Dettaglio
      </button>

      <button mat-button color="primary" (click)="onEdit()">
        Modifica
      </button>

      <button mat-button color="warn" (click)="onDelete()">
        Elimina
      </button>

    </mat-card-actions>

  </mat-card>

</div>
