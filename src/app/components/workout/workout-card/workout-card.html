<mat-card class="workout-card">
  <mat-card-header>

    <mat-card-title>
    {{ workout.name }}
    </mat-card-title>

  </mat-card-header>

  <mat-card-content>
    <p>Calorie bruciate: {{ workout.totalCaloriesBurned }}</p>
    <p>Numero esercizi: {{ workout.exercises?.length }}</p>
    <p>Creato il: {{ workout.createdAt | date:'short' }}</p>

    <mat-divider></mat-divider>
    
  
  <mat-card-actions>

    <button mat-button color="primary" (click)="onDetail()">
      Dettaglio
    </button>

    <button mat-button color="primary" (click)="onEdit()">
      Modifica
    </button>

    <button mat-button color="warn" (click)="onDelete()">
      Elimina
    </button>

    
  </mat-card-actions>
