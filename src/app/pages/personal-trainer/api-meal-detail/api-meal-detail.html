@if (meal$ | async; as meal) {

  <section class="detail-hero">
    <div class="detail-hero-container">
      <div class="detail-hero-text">
        <h1>{{ meal.strMeal | capitalize }}</h1>
        <p>{{ meal.strCategory }} • {{ meal.strArea }}</p>
      </div>
      <div class="detail-hero-image">
        <img [src]="meal.strMealThumb">
      </div>
    </div>
  </section>

  <section class="detail-section">

    <div class="detail-layout">

      <div class="instructions-block">
        <h2>Istruzioni</h2>
        <p class="instructions">{{ meal.strInstructions }}</p>
      </div>

      <div class="ingredients-block">
        <h2>Ingredienti</h2>
        @for (item of ingredients$ | async; track item.name) {
          <div class="ingredient">
            <span class="ingredient-name">{{ item.name | capitalize }}</span>
            <span class="ingredient-measure">{{ item.measure }}</span>
          </div>
        }
      </div>

    </div>

    <div class="back-action">
      <button mat-stroked-button (click)="onBack()">
        <mat-icon>arrow_back</mat-icon>
        Indietro
      </button>
    </div>

  </section>

}
